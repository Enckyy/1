<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b71c2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Скорая помощь курсантам">
<meta name="description" content="Учебный сервис для курсантов">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Скорая помощь курсантам</title>
<style>
:root{
  --bg:#f4f7f6;
  --card:#ffffff;
  --text:#172126;
  --muted:#66757b;
  --line:#dbe4e3;
  --red:#c52234;
  --red-dark:#9f1727;
  --red-soft:#fff1f3;
  --green:#d9ece4;
  --shadow:0 18px 50px rgba(30,48,53,.10);
  --radius:24px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 0%,rgba(197,34,52,.08),transparent 30%),
    radial-gradient(circle at 100% 20%,rgba(42,132,105,.07),transparent 28%),
    linear-gradient(180deg,#f8faf9 0,#eef4f2 100%);
}
.wrap{max-width:1120px;margin:auto;padding:34px 22px 48px}

/* ===== Шапка в тематике медицинской помощи ===== */
.hero{
  position:relative;
  overflow:hidden;
  padding:34px 38px;
  margin-bottom:22px;
  border:1px solid #e2d6d8;
  border-radius:28px;
  background:rgba(255,255,255,.96);
  box-shadow:var(--shadow);
}
.hero:before{
  content:"";
  position:absolute;
  left:-90px;
  top:-120px;
  width:330px;
  height:330px;
  border:1px solid rgba(197,34,52,.10);
  border-radius:50%;
  box-shadow:0 0 0 30px rgba(197,34,52,.035),0 0 0 62px rgba(197,34,52,.022);
}
.hero:after{
  content:"";
  position:absolute;
  right:-70px;
  bottom:-120px;
  width:280px;
  height:280px;
  border:1px solid rgba(42,132,105,.10);
  border-radius:50%;
  box-shadow:0 0 0 28px rgba(42,132,105,.025);
}
.hero-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:28px;
  position:relative;
  z-index:1;
}
.kicker{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--red-dark);
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.12em;
}
.kicker:before{
  content:"";
  display:block;
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--red);
  box-shadow:0 0 0 5px var(--red-soft);
}
h1{
  font-size:clamp(32px,5.5vw,52px);
  line-height:1.03;
  letter-spacing:-.035em;
  margin:10px 0 0;
}
.hero-mark{
  flex:0 0 auto;
  display:grid;
  place-items:center;
  width:92px;
  height:92px;
  border-radius:26px;
  background:var(--red);
  border:8px solid #fff;
  outline:1px solid #e9c8cd;
  box-shadow:0 12px 30px rgba(197,34,52,.20);
  color:#fff;
  font-size:52px;
  font-weight:900;
  line-height:1;
}
.med-cross{position:relative;width:48px;height:48px}
.med-cross:before,.med-cross:after{
  content:"";
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  background:#fff;
  border-radius:4px;
}
.med-cross:before{width:48px;height:14px}
.med-cross:after{width:14px;height:48px}

/* ===== Карточки предметов ===== */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.card{
  position:relative;
  display:flex;
  flex-direction:column;
  min-height:270px;
  padding:27px;
  overflow:hidden;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:var(--shadow);
  transition:transform .16s,box-shadow .16s,border-color .16s;
}
.card:before{
  content:"";
  position:absolute;
  left:0;top:0;right:0;
  height:5px;
  background:linear-gradient(90deg,var(--red),#e76b78);
}
.card:nth-child(2):before{background:linear-gradient(90deg,#27856c,#75b49f)}
.card:nth-child(3):before{background:linear-gradient(90deg,#9d2a75,#c96aa5)}
.card:nth-child(4):before{background:linear-gradient(90deg,#5165a8,#8192ce)}
.card:hover{
  transform:translateY(-3px);
  box-shadow:0 24px 58px rgba(30,48,53,.14);
  border-color:#c9d8d5;
}
.card-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}
.icon{
  display:grid;
  place-items:center;
  width:62px;
  height:62px;
  border-radius:19px;
  background:var(--red-soft);
  border:1px solid #f0d1d5;
  color:var(--red);
  font-size:31px;
}
.card:nth-child(2) .icon{background:#edf7f3;border-color:#d1e8df;color:#287a66}
.card:nth-child(3) .icon{background:#fbf0f7;border-color:#edd5e4;color:#9d2a75}
.card:nth-child(4) .icon{background:#f0f2fb;border-color:#d8dcef;color:#5165a8}
.card-number{
  font-size:12px;
  font-weight:900;
  color:#9aa8ab;
  letter-spacing:.14em;
}
.card h2{font-size:28px;line-height:1.12;margin:0 0 26px;letter-spacing:-.02em}
a.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:54px;
  margin-top:auto;
  padding:12px 16px;
  border-radius:15px;
  background:linear-gradient(135deg,var(--red),#d83b4d);
  color:#fff;
  text-decoration:none;
  font-weight:850;
  box-shadow:0 9px 20px rgba(197,34,52,.17);
  transition:transform .12s,box-shadow .12s,background .12s;
}
.card:nth-child(2) a.btn{
  background:linear-gradient(135deg,#287d68,#38947b);
  box-shadow:0 9px 20px rgba(40,125,104,.17);
}
.card:nth-child(3) a.btn{
  background:linear-gradient(135deg,#9d2a75,#bd4f91);
  box-shadow:0 9px 20px rgba(157,42,117,.16);
}
.card:nth-child(4) a.btn{
  background:linear-gradient(135deg,#5165a8,#6e80bd);
  box-shadow:0 9px 20px rgba(81,101,168,.16);
}
a.btn span{margin-left:8px;font-size:19px}
a.btn:hover{transform:translateY(-1px);box-shadow:0 13px 26px rgba(197,34,52,.23)}
.card:nth-child(2) a.btn:hover{box-shadow:0 13px 26px rgba(40,125,104,.23)}
.card:nth-child(3) a.btn:hover{box-shadow:0 13px 26px rgba(157,42,117,.23)}
.card:nth-child(4) a.btn:hover{box-shadow:0 13px 26px rgba(81,101,168,.23)}

/* Небольшая декоративная линия ЭКГ */
.ecg{
  height:28px;
  margin:0 0 22px;
  position:relative;
  opacity:.75;
  overflow:hidden;
}
.ecg:before{
  content:"";
  position:absolute;
  left:0;right:0;top:14px;
  height:2px;
  background:linear-gradient(90deg,transparent 0 4%,#e3b6bc 4% 17%,transparent 17% 20%,#c52234 20% 23%,transparent 23% 35%,#e3b6bc 35% 55%,transparent 55% 58%,#c52234 58% 61%,transparent 61% 100%);
}
.ecg:after{
  content:"";
  position:absolute;
  left:19%;top:1px;
  width:48px;height:25px;
  border-left:3px solid #c52234;
  border-bottom:3px solid #c52234;
  transform:skewX(-25deg) rotate(-28deg);
  clip-path:polygon(0 60%,35% 60%,50% 0,65% 100%,80% 60%,100% 60%,100% 72%,75% 72%,65% 100%,48% 20%,39% 72%,0 72%);
}
.footer{text-align:center;color:#879496;font-size:12px;margin-top:24px}
.footer-mark{
  display:inline-grid;
  place-items:center;
  width:18px;height:18px;
  margin-right:6px;
  border-radius:5px;
  background:var(--red);
  color:#fff;
  font-size:13px;
  font-weight:900;
  vertical-align:-4px;
}

@media(max-width:700px){
  .wrap{padding:14px 10px 32px}
  .hero{padding:24px 20px;border-radius:21px}
  .hero-row{align-items:flex-start;gap:15px}
  .hero-mark{width:64px;height:64px;border-radius:19px;border-width:6px;font-size:34px}
  .med-cross{transform:scale(.66)}
  h1{font-size:34px}
  .grid{grid-template-columns:1fr;gap:13px}
  .card{min-height:0;padding:21px;border-radius:20px}
  .card h2{font-size:24px;margin-bottom:22px}
  .icon{width:54px;height:54px;border-radius:17px}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="hero-row">
      <div>
        <div class="kicker">Учебный сервис</div>
        <h1>Скорая помощь курсантам</h1>
      </div>
      <div class="hero-mark" aria-hidden="true"><div class="med-cross"></div></div>
    </div>
  </section>

  <div class="ecg" aria-hidden="true"></div>

  <section class="grid">
    <article class="card">
      <div class="card-top"><div class="icon" aria-hidden="true">✚</div><span class="card-number">01</span></div>
      <h2>МОС</h2>
      <a class="btn" href="./mos.html">Открыть МОС <span>→</span></a>
    </article>

    <article class="card">
      <div class="card-top"><div class="icon" aria-hidden="true">✦</div><span class="card-number">02</span></div>
      <h2>Мореходная астрономия</h2>
      <a class="btn" href="./astronomy.html">Открыть астрономию <span>→</span></a>
    </article>

    <article class="card">
      <div class="card-top"><div class="icon" aria-hidden="true">⇄</div><span class="card-number">03</span></div>
      <h2>ТМП</h2>
      <a class="btn" href="#tmp" aria-disabled="true" onclick="return false;">Раздел в разработке <span>→</span></a>
    </article>

    <article class="card">
      <div class="card-top"><div class="icon" aria-hidden="true">⚓</div><span class="card-number">04</span></div>
      <h2>ТУС</h2>
      <a class="btn" href="#tus" aria-disabled="true" onclick="return false;">Раздел в разработке <span>→</span></a>
    </article>
  </section>

  <div class="footer"><span class="footer-mark">+</span> Учебные расчёты выполняются в браузере</div>
</div>
</body>
</html>
